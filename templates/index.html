<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Crawler</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px 16px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; }
        button { padding: 12px 24px; font-size: 16px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .result { background: white; border-radius: 8px; padding: 20px; white-space: pre-wrap; line-height: 1.6; }
        .error { background: #fef2f2; color: #dc2626; }
        .parsed { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Job Crawler</h1>
        <div class="search-box">
            <input type="text" id="query" placeholder="예: 서울 백엔드 개발자 3년차" autofocus>
            <button id="search">검색</button>
        </div>
        <div id="result"></div>
    </div>
    <script>
        const queryInput = document.getElementById('query');
        const searchBtn = document.getElementById('search');
        const resultDiv = document.getElementById('result');

        async function search() {
            const query = queryInput.value.trim();
            if (!query) return;

            searchBtn.disabled = true;
            resultDiv.className = 'result';
            resultDiv.textContent = '검색 중...';

            try {
                const res = await fetch('/api/search/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const data = await res.json();

                if (data.error) {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = data.error;
                } else {
                    resultDiv.innerHTML = data.response +
                        '<div class="parsed">파싱 결과: ' + JSON.stringify(data.parsed, null, 2) + '</div>';
                }
            } catch (e) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '요청 실패: ' + e.message;
            } finally {
                searchBtn.disabled = false;
            }
        }

        searchBtn.addEventListener('click', search);
        queryInput.addEventListener('keypress', e => { if (e.key === 'Enter') search(); });
    </script>
</body>
</html>
